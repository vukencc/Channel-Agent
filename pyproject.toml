[project]
name = "ai-agent-startup"
version = "0.5.0"
description = "AgentCore、AgentTest 与 Frontend 的开发工作区"
requires-python = ">=3.12"
dependencies = ["ai-agent-frontend==0.5.0", "ai-agent-test==0.5.0"]

[project.optional-dependencies]
web = ["ai-agent-frontend[web]"]
desktop = ["ai-agent-frontend[desktop]"]
documents = ["ai-agent-core[documents]"]
vision = ["ai-agent-core[vision]"]
ann = ["ai-agent-core[ann]"]

[dependency-groups]
dev = [
    "onnx>=1.23.0",
    "pyarrow>=25.0.1",
    "pytest>=8",
]
packaging = [
    "pyinstaller==6.22.3 ; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/agent_core", "src/agent_test", "src/agent_frontend"]

[tool.uv.sources]
ai-agent-core = { workspace = true }
ai-agent-frontend = { workspace = true }
ai-agent-test = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/agent_test/tests"]
markers = ["integration: real local embedding and reranking models"]
