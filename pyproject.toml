[project]
name = "ai-agent-startup"
version = "0.1.0"
description = "一个带工具调用（function calling）的最小流式对话 Agent"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28.1,<1",
    "jieba>=0.42.1",
    "numpy>=2.5.3",
    "openai>=2.15.0,<3",
    "prompt-toolkit>=3.0.53,<4",
    "pydantic>=2.13.0,<3",
    "python-dotenv>=1.2.0,<2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.0,<0.9",
]

[dependency-groups]
dev = [
    "onnx>=1.23.0",
    "pyarrow>=25.0.1",
    "pytest>=8",
]

[tool.uv]
# 这是一个应用（脚本），不是要发布的库，不需要被打包安装
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["dev/tests"]
markers = ["integration: real local embedding and reranking models"]
