name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      QT_QPA_PLATFORM: 'offscreen'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 校验发布标签、版本与稳定分支
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main
          python src/agent_test/scripts/check_release.py "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: ./.github/actions/setup-linux-system
      - run: uv sync --locked --extra web --extra desktop
      - name: 验证真实隔离能力
        run: uv run python -m agent_test.scripts.ci_sandbox_probe
      - run: uv run pytest -m 'not integration' -q

  windows_test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHON_DOTENV_DISABLED: '1'
      QT_QPA_PLATFORM: 'offscreen'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - name: 设置 Windows 独立测试目录
        shell: pwsh
        run: |
          "SANDBOX_DIR=$env:RUNNER_TEMP/agent-work" >> $env:GITHUB_ENV
          "AGENT_STATE_DIR=$env:RUNNER_TEMP/agent-state" >> $env:GITHUB_ENV
          "AUDIT_LOG=$env:RUNNER_TEMP/agent-audit.jsonl" >> $env:GITHUB_ENV
          "RAG_CACHE_DIR=$env:RUNNER_TEMP/agent-rag" >> $env:GITHUB_ENV
      - run: uv sync --locked --extra web --extra desktop
      - name: Windows 原生文件、状态、GUI 和 Web 回归
        shell: pwsh
        run: |
          $tests = @((Get-ChildItem src/agent_test/tests/test_desktop*.py).FullName)
          $tests += @((Get-ChildItem src/agent_test/tests/test_windows*.py).FullName)
          $tests += @(
            'src/agent_test/tests/test_file_crud.py',
            'src/agent_test/tests/test_cli.py',
            'src/agent_test/tests/test_cli_async_transcript.py',
            'src/agent_test/tests/test_web_ui.py',
            'src/agent_test/tests/test_bug10_storage.py',
            'src/agent_test/tests/test_session_persistence_barrier.py',
            'src/agent_test/tests/test_web_sse_terminal.py',
            'src/agent_test/tests/test_config.py',
            'src/agent_test/tests/test_chunking.py',
            'src/agent_test/tests/test_context.py',
            'src/agent_test/tests/test_context_boundaries.py',
            'src/agent_test/tests/test_context_supervisor.py',
            'src/agent_test/tests/test_compact_budget_headroom.py',
            'src/agent_test/tests/test_runtime_models.py',
            'src/agent_test/tests/test_free15_platform.py',
            'src/agent_test/tests/test_free16_prompt_templates.py',
            'src/agent_test/tests/test_web_flow_ui.py',
            'src/agent_test/tests/test_flow_handoff_contract.py',
            'src/agent_test/tests/test_flow_working.py',
            'src/agent_test/tests/test_working_child_turn.py',
            'src/agent_test/tests/test_web_working.py',
            'src/agent_test/tests/test_flow_durable_completion.py',
            'src/agent_test/tests/test_web_context_navigation.py',
            'src/agent_test/tests/test_workspace_picker_ui.py',
            'src/agent_test/tests/test_web_workspace_layout.py',
            'src/agent_test/tests/test_context_archive_debug.py',
            'src/agent_test/tests/test_custom_tools_runtime.py',
            'src/agent_test/tests/test_flow_custom_tools.py',
            'src/agent_test/tests/test_custom_tools_adversarial.py',
            'src/agent_test/tests/test_custom_tools_authority.py',
            'src/agent_test/tests/test_dynamic_wsl_authority.py',
            'src/agent_test/tests/test_custom_tool_entry_contract.py',
            'src/agent_test/tests/test_working_tool_display.py',
            'src/agent_test/tests/test_working_tooltip_pointer.py',
            'src/agent_test/tests/test_dynamic_feedback_validation.py',
            'src/agent_test/tests/test_flow_designer.py',
            'src/agent_test/tests/test_packaged_dynamic_smoke.py',
            'src/agent_test/tests/test_packaged_smoke.py'
          )
          uv run --no-sync pytest -m 'not integration' -q @tests
  image:
    if: github.event_name == 'push'
    needs: [test, windows_test]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 规范化镜像名（GHCR 要求小写）
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  linux_package:
    needs: [test, windows_test]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: ./.github/actions/setup-linux-system
      - run: uv sync --locked --group packaging --extra desktop --extra web --extra documents --extra vision
      - run: uv run --no-sync python -m agent_test.scripts.build_linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  windows_package:
    needs: [test, windows_test]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group packaging --extra desktop --extra web --extra documents --extra vision
      - run: uv run --no-sync python -m agent_test.scripts.build_windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [image, linux_package, windows_package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-package'
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
