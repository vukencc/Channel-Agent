name: Codex reviewed merge
# 无法关联的 fork 运行或暂时未知的合并状态保持开放，每小时重试。
on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Regression tests]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: codex-reviewed-merge
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.id == 199175422 && github.event.comment.user.type == 'Bot' &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.performed_via_github_app.id == 1144995) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check and merge exact reviewed heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/codex_automerge.py
