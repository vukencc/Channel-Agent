[project]
name = "ai-agent-frontend"
version = "0.2.1"
description = "Agent 的原生 GUI、CLI 与 WebUI"
requires-python = ">=3.12"
dependencies = [
    "ai-agent-core==0.2.1",
    "prompt-toolkit>=3.0.53,<4",
]
[project.scripts]
ai-agent-startup = "agent_frontend.main:main"
ai-agent-web = "agent_frontend.web.server:main"
ai-agent-gui = "agent_frontend.desktop.app:main"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
desktop = ["PySide6-Essentials>=6.8,<7"]
debug = ["ai-agent-test==0.2.1"]

[tool.uv.sources]
ai-agent-core = { workspace = true }
ai-agent-test = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 模块根即 Python 包；wheel 仅收纳源码和资源，开发安装直接引用 src。
[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "bootstrap.py", "cli", "desktop", "main.py", "web"]
sources = { "" = "agent_frontend" }
dev-mode-dirs = [".."]
