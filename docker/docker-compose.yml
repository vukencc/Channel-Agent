services:
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ai-agent-startup:${TAG:-v0.2.1}
    stdin_open: true
    tty: true
    env_file: [../.env]
    volumes:
      - agent-state:/data/state
      - agent-sandbox:/data/sandbox
      - agent-rag:/data/rag-cache
    # 容器内 run_command 沙箱需要放开 seccomp（默认已开启，保证开包即用）。
    # 若不需要命令工具，可注释掉以恢复更严格的默认隔离。
    security_opt: ["seccomp=unconfined"]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g

volumes:
  agent-state:
  agent-sandbox:
  agent-rag:
