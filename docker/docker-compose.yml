services:
  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ai-agent-startup:${TAG:-v0.2.0}
    stdin_open: true
    tty: true
    env_file: [../.env]
    volumes:
      - agent-state:/data/state
      - agent-sandbox:/data/sandbox
      - agent-rag:/data/rag-cache
    # 需要 run_command 沙箱时放开（先运行 dev/ci_sandbox_probe.py 验证）：
    # security_opt: ["seccomp=unconfined"]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g

volumes:
  agent-state:
  agent-sandbox:
  agent-rag:
